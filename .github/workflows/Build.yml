name: Build NOCLUETOOLS APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Setup Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Unzip Python Source (Fixed path)
    - name: Unzip Python Source
      run: |
        mkdir -p app/src/main/python
        unzip source.zip -d app/src/main/python/

    # 5. Build the APK (Added working-directory)
    - name: Build Debug APK
      run: gradle assembleDebug
      working-directory: . # <-- This ensures it runs in the root

    # 6. Upload APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NOCLUETOOLS-V1-APK
        path: app/build/outputs/apk/debug/app-debug.apk
