name: Build NOCLUETOOLS PRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # This lets you run it manually by clicking a button!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip NOCLUETOOLS.zip
        rm NOCLUETOOLS.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # This installs Gradle automatically since we are building from scratch
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Notice: No "./" before gradle
    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NOCLUETOOLS-PRO-APK
        path: app/build/outputs/apk/debug/app-debug.apk
