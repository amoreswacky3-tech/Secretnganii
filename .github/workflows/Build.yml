name: Build NOCLUETOOLS APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code from your repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Java 17 (Required for modern Android builds)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Set up Gradle (Using the cloud's Gradle so you don't need gradlew files)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Unzip your Python files into the correct directory
    - name: Unzip Python Source
      run: |
        mkdir -p app/src/main/python
        unzip source.zip -d app/src/main/python/

    # 5. Build the APK
    - name: Build Debug APK
      run: gradle assembleDebug

    # 6. Upload the finished APK so you can download it
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NOCLUETOOLS-V1-APK
        path: app/build/outputs/apk/debug/app-debug.apk
